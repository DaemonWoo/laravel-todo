    services:
        app:
            build:
                context: .
            container_name: laravel_app
            ports:
                - "8000:8000"
            volumes:
                - .:/var/www
            depends_on:
                - memcached

        memcached:
            image: memcached:latest
            container_name: memcached
            ports:
                - "11211:11211"

